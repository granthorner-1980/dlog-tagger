# One-click release: GitHub → Actions → "Release" → Run workflow.
# Builds the universal Mac app on a GitHub macOS machine, bumps VERSION in
# mac/build.sh, moves the CHANGELOG.md "Unreleased" notes under the new version,
# tags the commit, and publishes a GitHub release with those notes and the zip.
# It also signs the zip and publishes appcast.xml, the feed the app's
# "Check for Updates…" reads. The signing key (SPARKLE_PRIVATE_KEY) lives in the
# protected "release" environment, which only runs from the main branch.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 1.1.0"
        required: true
        type: string
      whats_new:
        description: "Optional extra line for the top of the release notes (the list of changes comes from CHANGELOG.md)"
        required: false
        type: string
      dry_run:
        description: "Test only: build the zip but don't publish anything"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-latest
    environment: release      # unlocks the signing key; GitHub only allows this on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists - pick a higher number"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set version in build script
        run: sed -i '' -E "s/^VERSION=\"[^\"]*\"/VERSION=\"$VERSION\"/" mac/build.sh && grep '^VERSION=' mac/build.sh

      - name: Build app and zip
        run: |
          swiftc --version
          cd mac && ./build.sh --zip
          ZIP="mac/build/DLogTagger-$VERSION-macOS.zip"
          test -f "../$ZIP"
          lipo -archs "build/D-Log Tagger.app/Contents/MacOS/DLogTagger"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA=$(shasum -a 256 "../$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run tests (detection, corrupt files, no-overwrite) – nothing is published if these fail
        run: python3 tests/test_dlog_tagger.py

      - name: Write release notes from CHANGELOG.md
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          CHANGES="$(.github/scripts/changelog.sh unreleased)"
          if [ -z "$CHANGES" ] && [ -z "$WHATS_NEW" ]; then
            echo "::error::Nothing listed under 'Unreleased' in CHANGELOG.md. Add what changed there (or fill in the extra-line box) and run again."
            exit 1
          fi
          {
            if [ -n "$WHATS_NEW" ]; then echo "$WHATS_NEW"; echo; fi
            if [ -n "$CHANGES" ]; then echo "## What's new"; echo; echo "$CHANGES"; echo; fi
            echo "## Install"
            echo "**Already have 1.2.0 or later?** Choose **D-Log Tagger → Check for Updates…** (or just wait for the update prompt)."
            echo
            echo "**New, or on 1.0 / 1.1:**"
            echo
            echo "1. Download \`DLogTagger-$VERSION-macOS.zip\` below, unzip, and drag **D-Log Tagger** to Applications."
            echo "2. First launch: macOS can't verify it (not notarised yet). Click **Done**, then **System Settings → Privacy & Security → Open Anyway**."
            echo
            echo "Requires macOS 14 or later · Universal (Apple Silicon + Intel)."
            echo
            echo "SHA-256 \`$SHA\`"
          } > "$RUNNER_TEMP/notes.md"
          {
            if [ -n "$WHATS_NEW" ]; then echo "$WHATS_NEW"; echo; fi
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; fi
          } > "$RUNNER_TEMP/update-notes.md"
          echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          { echo "# Release notes for v$VERSION"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md"

      - name: Sign the update and write the update feed (appcast.xml)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing from the 'release' environment (Settings → Environments → release). See RELEASING.md."
            exit 1
          fi
          BIN="$(echo mac/vendor/Sparkle-*/bin)"
          APP="mac/build/D-Log Tagger.app"
          SIG="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$BIN/sign_update" --ed-key-file - -p "$ZIP")"
          swift .github/scripts/verify_update.swift "$APP" "$ZIP" "$SIG"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          URL="https://github.com/$REPO/releases/download/v$VERSION/$(basename "$ZIP")"
          FEED=mac/build/appcast.xml
          python3 .github/scripts/appcast.py "$VERSION" "$MIN_OS" "$URL" "$ZIP" "$SIG" "$RUNNER_TEMP/update-notes.md" > "$FEED"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$BIN/sign_update" --ed-key-file - "$FEED"
          grep -q 'sparkle-signatures' "$FEED"
          xmllint --noout "$FEED"
          echo "FEED=$FEED" >> "$GITHUB_ENV"
          cat "$FEED"

      - name: Upload zip + update feed (test runs)
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DLogTagger-${{ env.VERSION }}-macOS
          path: |
            ${{ env.ZIP }}
            ${{ env.FEED }}

      - name: Commit version + changelog, tag, publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/changelog.sh stamp "$VERSION" "$(date -u +%Y-%m-%d)"
          git add mac/build.sh CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
            git push origin HEAD
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" "$ZIP" "$FEED" --title "D-Log Tagger $VERSION" --notes-file "$NOTES"
